# ─────────────────────────────────────────────────────────────────────────────
# theme.toml - the ONLY build input of this repo. Read by `w11cursor` (w11-cursor-toolkit).
#   python tools/goldify.py                       # src/svg -> build/gold (the gold style, see tools/goldify.py)
#   w11cursor build theme.toml && w11cursor validate theme.toml
# ─────────────────────────────────────────────────────────────────────────────
schema = 1

[theme]
slug        = "layan"
name        = "Layan Cursors (Gold)"
version     = "3.1.0"
license     = "GPL-3.0"
porter      = "vinceliuice; gold edition by hervad"
description = "Layan cursors in gold"

[upstream]
kind    = "vendored"
url     = "https://github.com/vinceliuice/Layan-cursors"
ref     = "b8c4689"                     # src/svg = the "svg" variant at this commit, vendored unmodified
path    = "src/svg"
authors = ["vinceliuice"]
license = "GPL-3.0"

[sizes]                  # toolkit defaults, except the animations:
animated = [32, 48, 64, 72, 80, 96, 120, 128]   # 144 dropped: busy frame 13 would start an image at byte 71,832 > 65,535
ani_budget_bytes = 1_700_000                    # busy 1.62 MB (maintainer, 2026-10-08: keep 32-128; v2 shipped a 1.19 MB .ani)

[render]
renderer      = "resvg"                 # as v2's build.py; keeps the soft shadows/glows the art draws with SVG filters
design_canvas = 32                      # the SVGs are drawn on a 32-unit grid
hotspot_mode  = "pixel"                 # the pixel that CONTAINS the point, as v2 (floor): keeps v2's hotspots

[[variants]]
id          = "gold"
scheme_name = "Layan Gold W11 HiDPI"    # v3.1.0; v2.x-3.0 used "Layan Cursors (Gold)" (README: upgrade note)
svg_dir     = "build/gold"              # generated by tools/goldify.py (CI: workflow pre-build)

# Roles, files and hotspots exactly as v2's build.py ROLES (hotspots in SVG units; pointer hotspots are measured at
# the visible tip). Animation: 23 frames x 2 jiffies (33 ms), upstream's 30 ms per frame.
[cursors.arrow]
svg = "default.svg"
hotspot = [4.78, 5.66]

[cursors.help]
svg = "help.svg"
hotspot = [4.78, 5.66]

[cursors.working]
frames = "progress-{n:02d}.svg"
frame_count = 23
frame_start = 1
delay = 2
hotspot = [4.78, 5.66]

[cursors.busy]
frames = "wait-{n:02d}.svg"
frame_count = 23
frame_start = 1
delay = 2
hotspot = [16, 16]

[cursors.precision]
svg = "crosshair.svg"
hotspot = [16, 16]

[cursors.text]
svg = "text.svg"
hotspot = [16, 16]

[cursors.handwriting]
svg = "pencil.svg"
hotspot = [2.56, 29.31]

[cursors.unavailable]
svg = "not-allowed.svg"
hotspot = [16, 16]

[cursors.vert]
svg = "row-resize.svg"
hotspot = [16, 16]

[cursors.horz]
svg = "col-resize.svg"
hotspot = [16, 16]

[cursors.dgn1]
svg = "bottom_right_corner.svg"
hotspot = [16, 16]

[cursors.dgn2]
svg = "bottom_left_corner.svg"
hotspot = [16, 16]

[cursors.move]
svg = "all-scroll.svg"
hotspot = [16, 16]

[cursors.alternate]
svg = "up-arrow.svg"
hotspot = [16, 4.5]

[cursors.link]
svg = "pointer.svg"
hotspot = [13.78, 6.25]

[cursors.pin]            # new in v3: v2 left Pin and Person empty (Windows then shows its default)
same_as = "link"

[cursors.person]
same_as = "link"
